# Toolchain pin -- reproducibility.
#
# This project was developed and its `cargo test`/`cargo clippy` runs were
# validated against a specific compiler. Pin the *exact* toolchain so a fresh
# checkout builds bit-for-bit what was tested: the compiler's version can matter
# for `unsafe` semantics, lint availability, and deterministic builds.
#
# The project targets the latest stable Rust, so `rust-version` in `Cargo.toml`
# tracks this pin (same minor version) rather than an older floor: bump the two
# together. 1.98.1 is the latest stable release as of 2026-09-26.
#
# Install once: `rustup toolchain install 1.98.1 --profile minimal`.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
