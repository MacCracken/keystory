[package]
name = "keystore"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Crash-resilient, replicated KV store engine modeled on Raft (Phase 1: single-node)."
license = "MIT OR Apache-2.0"

# Phase 1 has NO external dependencies: std-only. This honours the
# "no third-party libraries" constraint (no consensus, no async runtime
# even; Phase 3 will add tokio, but only for networking, never consensus).
[dependencies]

[lib]
name = "keystore"
crate-type = ["rlib"]

[[bin]]
name = "keystore-crash-runner"
path = "src/main.rs"

[profile.release]
debug = 2
