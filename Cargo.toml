[package]
name = "keystore"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Crash-resilient, replicated KV store engine modeled on Raft (Phase 1: single-node)."
license = "MIT OR Apache-2.0"

# Phase 1-4 were std-only (no third-party libraries: no consensus, no async
# runtime). Phase 5 (3/3) deliberately lifts that gate -- and ONLY that gate --
# for real, non-blocking I/O via `mio`. Nothing else is added: no consensus
# crate, no async runtime, no RPC. mio is the single external dependency.
[dependencies]
# Phase 5 (3/3): real, non-blocking event-driven I/O. The one external
# dependency; see src/asyncio.rs for how it is used and why it is the only one.
mio = { version = "0.8", features = ["os-ext"] }

[lib]
name = "keystore"
crate-type = ["rlib"]

[[bin]]
name = "keystore-crash-runner"
path = "src/main.rs"

[profile.release]
debug = 2
