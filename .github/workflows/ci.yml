name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The toolchain comes from rust-toolchain.toml (pinned, with rustfmt + clippy), which
# rustup on the GitHub runners installs automatically on the first cargo invocation.
#
# Two feature sets are checked: the default (dependency-free) build, and `experimental`,
# which adds the Raft layer, the runtime, the mio reactor and the other building blocks.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: cargo doc --no-deps
      - run: cargo doc --no-deps --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The crash tests SIGKILL a child via `kill -9`, so the suite is Unix-only.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Unit, integration and doc tests, with every feature and with none -- the build users
      # get by default. (`--all-targets` would skip the doctests.)
      - run: cargo test --all-features
      - run: cargo test
      - run: cargo build --release

  package:
    name: package (what crates.io would receive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the packaged crate from its .crate file, as a publish would.
      - run: cargo package --locked
